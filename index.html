<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Counter App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="counter-container">
      <h1>Counter</h1>

      <div id="counter-value" class="value-positive">0</div>

      <div class="button-group">
        <button id="decrease-btn" class="btn btn-decrease">Decrease</button>
        <button id="reset-btn" class="btn btn-reset">Reset</button>
        <button id="increase-btn" class="btn btn-increase">Increase</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
